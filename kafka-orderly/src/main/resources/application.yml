spring:
  application:
    name: kafka-orderly

  datasource:
    url: jdbc:mysql://localhost:3306/rocketmq_orderly?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: opc.tang2026
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: kafka-orderly-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual_immediate
      concurrency: 1

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.example.common.entity

logging:
  level:
    com.example: DEBUG
    org.apache.kafka: INFO
